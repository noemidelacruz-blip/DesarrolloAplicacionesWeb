# ============================================================
# Configuración común a todos los perfiles
# Perfil activo por defecto: dev  (cambiar con SPRING_PROFILES_ACTIVE=prod)
# ============================================================
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: servicio-propietario
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
# ============================================================
# PERFIL DEV: desarrollo local
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_propietario?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    root: INFO
    com.veterinaria: DEBUG
---
# ============================================================
# PERFIL PROD: producción (credenciales SOLO por variables de entorno)
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: WARN
    com.veterinaria: INFO
