server:
  port: 8085

spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:mysql://localhost:3306/bd_pedido_dev?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

empresa:
  ambiente: desarrollo

# Configuracion Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
